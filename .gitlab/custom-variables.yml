variables:
  # Keep allocation names unique across project pipelines.
  ALLOC_NAME: ${CI_PROJECT_NAME}_ci_${CI_PIPELINE_ID}

  # Dane shared allocation and per-job launch arguments.
  DANE_SHARED_ALLOC: "--exclusive --reservation=ci --time=21 --nodes=1"
  DANE_JOB_ALLOC: "--overlap --reservation=ci --time=20 --nodes=1"

  # Tioga runs jobs in individual Flux allocations because MPI tests cannot
  # run inside a nested Flux allocation.
  TIOGA_SHARED_ALLOC: "OFF"
  TIOGA_JOB_ALLOC: "--queue=pci --exclusive --time-limit=72m --nodes=1 --begin-time=+5s"
