# General GitLab pipeline configuration for LLNL systems. This file consumes
# GitLab CI Components from radiuss-shared-ci (GitLab 17.0 or newer).

variables:
  # Use an LLNL service user to run CI when one is configured for the project.
  LLNL_SERVICE_USER: ""
  GIT_SUBMODULE_STRATEGY: recursive

  # Required information about the GitHub repository.
  GITHUB_PROJECT_NAME: "SAMRAI"
  GITHUB_PROJECT_ORG: "LLNL"

  # Keep expansion deferred so individual jobs can set BUILD_OPTION.
  JOB_CMD:
    value: "source/scripts/gitlab/build_and_test_tpl.sh ${BUILD_OPTION}"
    expand: false

# Components do not declare stages, which lets projects customize this list.
stages:
  - prerequisites
  - build-and-test

include:
  # Provides machine-check and child-pipeline trigger templates.
  - component: $CI_SERVER_FQDN/radiuss/radiuss-shared-ci/base-pipeline@2026.6.0
    inputs:
      github_project_name: $GITHUB_PROJECT_NAME
      github_project_org: $GITHUB_PROJECT_ORG
      github_token: $RSCI_GITHUB_STATUS_TOKEN

  # Allocation settings shared by the machine child-pipeline definitions.
  - local: '.gitlab/custom-variables.yml'

# DANE
dane-up-check:
  extends: [.dane, .machine-check]
  variables:
    ASSOCIATED_CHILD_PIPELINE: "dane-build-and-test"

dane-build-and-test:
  extends: [.dane, .build-and-test]
  needs: [dane-up-check]
  trigger:
    include:
      - component: $CI_SERVER_FQDN/radiuss/radiuss-shared-ci/dane-pipeline@2026.6.0
        inputs:
          job_cmd: $JOB_CMD
          shared_alloc: $DANE_SHARED_ALLOC
          job_alloc: $DANE_JOB_ALLOC
          github_project_name: $GITHUB_PROJECT_NAME
          github_project_org: $GITHUB_PROJECT_ORG
          llnl_service_user: $LLNL_SERVICE_USER
          alloc_name: $ALLOC_NAME
      - local: '.gitlab/custom-jobs.yml'
      - local: '.gitlab/jobs/dane.yml'

# TIOGA
tioga-up-check:
  extends: [.tioga, .machine-check]
  variables:
    ASSOCIATED_CHILD_PIPELINE: "tioga-build-and-test"

tioga-build-and-test:
  extends: [.tioga, .build-and-test]
  needs: [tioga-up-check]
  trigger:
    include:
      - component: $CI_SERVER_FQDN/radiuss/radiuss-shared-ci/tioga-pipeline@2026.6.0
        inputs:
          job_cmd: $JOB_CMD
          shared_alloc: $TIOGA_SHARED_ALLOC
          job_alloc: $TIOGA_JOB_ALLOC
          github_project_name: $GITHUB_PROJECT_NAME
          github_project_org: $GITHUB_PROJECT_ORG
          llnl_service_user: $LLNL_SERVICE_USER
          alloc_name: $ALLOC_NAME
      - local: '.gitlab/custom-jobs.yml'
      - local: '.gitlab/jobs/tioga.yml'
